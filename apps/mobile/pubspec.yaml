name: wayfarer_mobile
description: WayfarerPhone —— 世界人生模拟器（单机离线）
publish_to: none
version: 0.1.0+1
resolution: workspace

environment:
  sdk: ^3.9.0

dependencies:
  contracts:
    path: ../../packages/contracts
  engine:
    path: ../../packages/engine
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  file_selector: ^1.0.0
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.0
  share_plus: ^11.0.0
  sqlite3_flutter_libs: ^0.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/seed/cangwu/bible.json
    - assets/seed/cangwu/identities.json
    - assets/seed/cangwu/seeds.json
    - assets/seed/cangwu/volume1.json
